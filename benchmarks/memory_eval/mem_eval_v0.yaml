version: "0.1"
memories:
  - id: mem_json
    type: semantic
    content: "Para saída estruturada, responda somente JSON válido e valide os campos obrigatórios."
  - id: mem_workspace
    type: procedural
    content: "Use somente caminhos relativos ao workspace autorizado e verifique o artefato escrito."
  - id: mem_timeout
    type: procedural
    content: "Em timeout, classifique a falha, limite tentativas e aplique recuperação segura."
  - id: mem_policy
    type: semantic
    content: "Caminhos UNC, device paths, expansão de ambiente e escape de workspace são bloqueados."
  - id: mem_testing
    type: procedural
    content: "Use avaliador determinístico quando ele existir e preserve evidências do resultado."
  - id: mem_context
    type: semantic
    content: "Contexto excessivo pode degradar modelos pequenos; entregue apenas blocos relevantes."
  - id: mem_skill
    type: procedural
    content: "Uma skill requer usos repetidos e sucesso medido antes de ser reutilizada."
  - id: mem_leakage
    type: semantic
    content: "Tarefas e respostas privadas de benchmark não entram em experiências ou prompts."
  - id: mem_recovery
    type: procedural
    content: "Recurso ausente: confirme caminho permitido e proponha alternativa antes de repetir."
  - id: mem_bad_recipe
    type: world
    content: "Receitas de bolo usam farinha e fermento."
queries:
